name = "mountain-cam-archive"
main = "src/worker.js"
compatibility_date = "2026-11-01"

# Statična stran (frontend/). Datoteke, ki obstajajo, postreže Cloudflare brez Workerja.
[assets]
directory = "./frontend"

# R2 bucket je dostopen samo Workerju, nikoli brskalniku.
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "mountain-cams"

# Sprožilec zajema (cron v UTC): vsako polno uro. Worker zažene zajem samo ob terminih (SLOTS).
[triggers]
crons = ["0 * * * *"]

[vars]
GH_REPO = "lukastrumbelj/mountain-cam-archive"
GH_WORKFLOW = "capture.yml"
GH_REF = "main"
TIMEZONE = "Europe/Ljubljana"
# Termini zajema (lokalni čas). Uskladi s config/cameras.yaml -> settings.slots.
SLOTS = "00:00,01:00,02:00,03:00,04:00,05:00,06:00,07:00,08:00,09:00,10:00,11:00,12:00,13:00,14:00,15:00,16:00,17:00,18:00,19:00,20:00,21:00,22:00,23:00"
# GH_TOKEN je skrivnost: Cloudflare -> Worker -> Settings -> Variables and Secrets (ne v to datoteko!)
