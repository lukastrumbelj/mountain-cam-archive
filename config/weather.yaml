    name: Julijske Alpe (jugozahod)
    url: https://meteo.arso.gov.si/uploads/probase/www/fproduct/text/sl/forecast_SI_JULIAN-ALPS_SOUTH-WEST_long.html
  - id: kamnisko-savinjske-alpe
    name: Kamniško-Savinjske Alpe
    url: https://meteo.arso.gov.si/uploads/probase/www/fproduct/text/sl/forecast_SI_KAMNIK-SAVINJA-ALPS_long.html
  - id: karavanke
    name: Karavanke
    url: https://meteo.arso.gov.si/uploads/probase/www/fproduct/text/sl/forecast_SI_KARAVANKE-ALPS_long.html
  - id: pohorje
    name: Pohorje
    url: https://meteo.arso.gov.si/uploads/probase/www/fproduct/text/sl/forecast_SI_POHORJE_long.html
  - id: snezznik
