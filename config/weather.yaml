# Dnevni posnetek ARSO napovedi za hribe (workflow weather.yml; sproži ga Cloudflare Worker ob "time").
# Vir: ARSO (meteo.si), podatki so javni in se smejo ponovno uporabljati z navedbo vira.
settings:
  time: "12:00"            # lokalni čas dnevnega zajema (uskladi s WEATHER_AT v wrangler.toml)
  # hramba: config/cameras.yaml -> settings.retention_days (isto kot pri kamerah)
  viewport_width: 1900     # tabela ima ~33 stolpcev: široko okno, da je vse na eni sliki
  jpeg_quality: 85
  timeout_seconds: 40

pages:
  - id: julijske-alpe
    name: Julijske Alpe
    url: https://meteo.arso.gov.si/uploads/probase/www/fproduct/text/sl/forecast_SI_JULIAN-ALPS_long.html
