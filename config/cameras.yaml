# Konfiguracija kamer. Nova kamera = nov blok v "cameras". Nič drugega ni treba spreminjati.
#
# mode:
#   direct     - neposreden URL slike (image_url)          -> brez brskalnika, najcenejše
#   selector   - Playwright zajame element (selector)      -> potrebuje selector
#   screenshot - Playwright zajame prikaz strani           -> extra: clip, full_page
#   custom     - Playwright + extra.steps (click/wait/hide) -> selector neobvezen
#
# extra (neobvezno): headers, steps, clip {x,y,width,height}, full_page, viewport {width,height}

settings:
  # Pred uporabo zamenjaj z lastnim repozitorijem, da je vir zahtevkov prepoznaven.
  user_agent: "MountainCamArchive/0.1 (osebni neprofitni arhiv; +https://github.com/lukastrumbelj/mountain-cam-archive)"
  timeout_seconds: 20
  retention_days: 7
  jpeg_quality: 88
  min_width: 200
  min_height: 120
  timezone: Europe/Ljubljana
  slots: ["07:00", "10:00", "13:00", "16:00", "19:00"]

cameras:
  - id: kamnisko-sedlo
    name: Kamniško sedlo
    location: Kamniška koča na Kamniškem sedlu, Kamniško-Savinjske Alpe
    url: https://kamniska-koca.si/
    mode: direct
    image_url: https://pdkamnik.si/webcam/sedlo.jpg
    wait_seconds: 0
    active: true

  - id: zgornje-jezersko
    name: Zgornje Jezersko
    location: Zgornje Jezersko (880 m), Kamniško-Savinjske Alpe
    url: https://www.hribi.net/spletna_kamera/zgornje_jezersko/1071
    mode: direct
    image_url: https://www.drsc.si/kamere/Jezersko/Jez1_0001.jpg
    wait_seconds: 0
    active: true

  - id: rudno-polje-ne
    name: Rudno polje (SV)
    location: Rudno polje, Pokljuka (1344 m), Julijske Alpe
    url: https://www.hribi.net/spletna_kamera/pokljuka/1700
    mode: direct
    image_url: http://meteo.arso.gov.si/uploads/probase/www/observ/webcam/RUDNO-POL_dir/siwc_RUDNO-POL_ne.jpg
    wait_seconds: 0
    active: true

  - id: rudno-polje-j
    name: Rudno polje (J)
    location: Rudno polje, Pokljuka (1344 m), Julijske Alpe
    url: https://www.hribi.net/spletna_kamera/pokljuka/1700
