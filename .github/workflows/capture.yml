name: capture

on:
  # Redni zagon sproži Cloudflare Worker (cron + workflow_dispatch z mode=slot), ker je GitHubov
  # "schedule" neustrezno zanesljiv. Termini (Europe/Ljubljana) so v config/cameras.yaml -> settings.slots.
  workflow_dispatch:
    inputs:
      only:
        description: "ID kamer (ločeni s presledkom), prazno = vse"
        required: false
        default: ""
      mode:
        description: "slot = samo če je ura termin (uporablja sprožilec); prazno = ročni zajem takoj"
        required: false
        default: ""

# En zajem naenkrat: preprečuje hkratno pisanje v index.json.
concurrency:
  group:  cancel-in-progress: false

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Playwright (samo če kamera uporablja brskalnik)
        run: |
          if grep -Eq "^\s*mode:\s*(selector|screenshot|custom|video)" config/cameras.yaml; then
            playwright install --with-deps chromium
          fi

      - name: Zajem
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          ONLY: ${{ github.event.inputs.only }}
          MODE: ${{ github.event.inputs.mode }}
        run: |
          if [ "$MODE" = "slot" ]; then
            python -m backend.main --require-slot --tolerance 30
          elif [ -n "$ONLY" ]; then
            python -m backend.main --manual --only $ONLY
          else
            python -m backend.main --manual
          fi
