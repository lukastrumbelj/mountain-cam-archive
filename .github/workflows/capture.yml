name: capture

on:
  schedule:
    # Termini (Europe/Ljubljana) so v config/cameras.yaml -> settings.slots.
    # GitHub cron je samo v UTC: vsako uro ob :07; --require-slot preskoči zagone brez termina
    # (npr. sode ure ponoči), zato zimski/poletni čas ne zahteva ročnih sprememb.
    # Minuta 7 namesto 0: GitHub ob polnih urah pogosto zamuja.
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "ID kamer (ločeni s presledkom), prazno = vse"
        required: false
        default: ""

# En zajem naenkrat: preprečuje hkratno pisanje v index.json.
concurrency:
  group: capture
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Playwright (samo če kamera uporablja brskalnik)
        run: |
          if grep -Eq "^\s*mode:\s*(selector|screenshot|custom|video)" config/cameras.yaml; then
            playwright install --with-deps chromium
          fi

      - name: Zajem
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          ONLY: ${{ github.event.inputs.only }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python -m backend.main --require-slot --tolerance 30
          elif [ -n "$ONLY" ]; then
            python -m backend.main --manual --only $ONLY
          else
            python -m backend.main --manual
          fi
