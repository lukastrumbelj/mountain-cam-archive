name: cleanup

on:
  schedule:
    - cron: "40 2 * * *"   # vsak dan ponoči (zajemi so šele ob 05:07 UTC)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Samo izpiši, ne briši"
        type: boolean
        default: false

# Isti sklop kot capture: nikoli hkrati, ker oba pišeta meta/status.json.
concurrency:
  group: capture
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Brisanje starih slik
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          DRY: ${{ github.event.inputs.dry_run }}
        run: |
          if [ "$DRY" = "true" ]; then
            python -m backend.cleanup --dry-run
          else
            python -m backend.cleanup
          fi
