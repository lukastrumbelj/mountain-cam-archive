<!doctype html>
<html lang="sl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kamera – arhiv</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <div>
      <a href="index.html" class="muted">← Vse kamere</a>
      <h1 id="title">Nalagam …</h1>
      <div id="sub" class="muted"></div>
    </div>
    <span id="badge"></span>
  </header>
  <main>
    <div id="err"></div>
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="view" aria-selected="true">Pregled</button>
      <button role="tab" data-tab="lapse" aria-selected="false">Časovni posnetek</button>
      <button role="tab" data-tab="cmp" aria-selected="false">Primerjava</button>
    </div>

    <section id="view">
      <div class="viewer"><img id="big" alt=""></div>
      <p id="caption" class="muted"></p>
      <div class="controls">
        <button id="prev">← Prejšnja</button>
        <select id="dateSel" aria-label="Datum"></select>
        <button id="next">Naslednja →</button>
      </div>
      <div id="hours" class="chips"></div>
    </section>

    <section id="lapse" hidden>
      <div class="controls">
        <select id="lapseScope" aria-label="Obseg">
          <option value="day">Izbrani dan</option>
          <option value="week">Zadnjih 7 dni</option>
        </select>
        <select id="lapseDate" aria-label="Datum"></select>
        <select id="lapseSpeed" aria-label="Hitrost">
          <option value="0.5">0,5×</option><option value="1" selected>1×</option>
          <option value="2">2×</option><option value="4">4×</option>
        </select>
        <button id="playBtn" class="primary">▶ Predvajaj</button>
      </div>
      <div class="viewer"><img id="lapseImg" alt=""></div>
      <div class="controls">
        <button id="lapsePrev">←</button>
        <input id="lapseRange" type="range" min="0" max="0" value="0" aria-label="Sličica">
        <button id="lapseNext">→</button>
      </div>
      <p id="lapseCaption" class="muted"></p>
    </section>

    <section id="cmp" hidden>
      <div class="compare">
        <div>
          <div class="controls"><select id="dateA"></select><select id="hourA"></select></div>
          <img id="imgA" alt="">
        </div>
        <div>
          <div class="controls"><select id="dateB"></select><select id="hourB"></select></div>
          <img id="imgB" alt="">
        </div>
      </div>
    </section>
  </main>
  <script type="module" src="js/camera.js"></script>
</body>
</html>
